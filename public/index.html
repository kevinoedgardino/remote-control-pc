<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control PC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 6h14v9H5z" />
          <path d="M9 19h6" />
          <path d="M12 15v4" />
        </svg>
      </span>
      <div>
        <h1>Control PC</h1>
        <p id="status">Desconectado</p>
      </div>
    </div>

    <button class="icon-btn" id="btnLogToggle" type="button" aria-label="Abrir consola">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 5h16v14H4z" />
        <path d="M7 9l3 3-3 3" />
        <path d="M12 15h5" />
      </svg>
    </button>
  </nav>

  <main>
    <div class="controls">
      <button class="btn btn-power" id="btnPower" aria-label="Apagar PC">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v9" />
          <path d="M18.36 5.64a9 9 0 1 1-12.72 0" class="danger-stroke" />
        </svg>
      </button>

      <button class="btn" id="btnVolumeDown" aria-label="Bajar volumen">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M15 12h4" />
        </svg>
      </button>

      <button class="btn" id="btnVolumeToggle" aria-label="Silenciar volumen">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M16 9.5a4 4 0 0 1 0 5" />
          <path d="M18.5 7a7 7 0 0 1 0 10" />
        </svg>
      </button>

      <button class="btn" id="btnVolumeUp" aria-label="Subir volumen">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M17 10v4" />
          <path d="M15 12h4" />
        </svg>
      </button>
    </div>

    <div class="controls keyboard-controls">
      <button class="btn btn-text" id="btnEsc" aria-label="Escape">ESC</button>
      <button class="btn" id="btnTab" aria-label="Tab">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 4v16" />
          <path d="M4 12h13" />
          <path d="M13 8l4 4-4 4" />
        </svg>
      </button>
      <button class="btn btn-text" id="btnBackspace" aria-label="Eliminar">DEL</button>
      <button class="btn btn-space" id="btnSpace" aria-label="Espacio">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button class="btn" id="btnEnter" aria-label="Enter">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 7v3a3 3 0 0 1-3 3H5" />
          <path d="M9 9l-4 4 4 4" />
        </svg>
      </button>
    </div>

    <form class="text-control" id="textForm">
      <input class="text-input" id="textInput" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Texto">
      <button class="send-text-btn" id="btnSendText" type="submit" aria-label="Enviar texto">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h13" />
          <path d="M14 8l4 4-4 4" />
        </svg>
      </button>
    </form>

    <div class="dpad">
      <span></span>
      <button class="btn" id="btnArrowUp" aria-label="Flecha arriba">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20V4" />
          <path d="M18 10l-6-6-6 6" />
        </svg>
      </button>
      <span></span>

      <button class="btn btn-arrow-left" id="btnArrowLeft" aria-label="Flecha izquierda">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20V4" />
          <path d="M18 10l-6-6-6 6" />
        </svg>
      </button>
      <button class="btn btn-arrow-down" id="btnArrowDown" aria-label="Flecha abajo">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20V4" />
          <path d="M18 10l-6-6-6 6" />
        </svg>
      </button>
      <button class="btn btn-arrow-right" id="btnArrowRight" aria-label="Flecha derecha">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 20V4" />
          <path d="M18 10l-6-6-6 6" />
        </svg>
      </button>
    </div>

    <div class="touchpad" id="touchpad" role="application" aria-label="Touchpad para mover el mouse"></div>
  </main>

  <div class="modal" id="logModal" hidden>
    <button class="modal-backdrop" id="logModalBackdrop" type="button" aria-label="Cerrar consola"></button>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="logModalTitle">
      <header class="modal-header">
        <h2 id="logModalTitle">Consola</h2>
        <button class="icon-btn" id="btnLogClose" type="button" aria-label="Cerrar consola">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6l12 12" />
            <path d="M18 6L6 18" />
          </svg>
        </button>
      </header>
      <ol class="log-list" id="logList"></ol>
    </section>
  </div>

  <script type="text/javascript" src="app.js"></script>
</body>
</html>
